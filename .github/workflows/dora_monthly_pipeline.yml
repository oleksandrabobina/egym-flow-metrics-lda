name: DORA Metrics Automated Pipeline

on:
  schedule:
    - cron: '0 0 1 * *' # Runs on the 1st of every month
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database & Seed Registries
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHEET_TEAM_MAPPING_GID: ${{ secrets.SHEET_TEAM_MAPPING_GID }}
          SHEET_JIRA_MI_GID: ${{ secrets.SHEET_JIRA_MI_GID }}
          SHEET_JIRA_MSW_GID: ${{ secrets.SHEET_JIRA_MSW_GID }}
          SHEET_JIRA_ALL_PROJECTS_GID: ${{ secrets.SHEET_JIRA_ALL_PROJECTS_GID }}
          SHEET_GITHUB_MI_GID: ${{ secrets.SHEET_GITHUB_MI_GID }}
          SHEET_GITHUB_MSW_GID: ${{ secrets.SHEET_GITHUB_MSW_GID }}
          SHEET_GITHUB_WELLPASS_GID: ${{ secrets.SHEET_GITHUB_WELLPASS_GID }}
          SHEET_GITHUB_CORE_GID: ${{ secrets.SHEET_GITHUB_CORE_GID }}
        run: |
          python database/init_db.py
          python database/seed_from_sheet.py

      - name: Ingest Raw Telemetry (Jira, GitHub SRE, Incident.io)
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SERVICE_INVENTORY_URL: ${{ secrets.SERVICE_INVENTORY_URL }}
          SERVICE_INVENTORY_API_KEY: ${{ secrets.SERVICE_INVENTORY_API_KEY }}
          INCIDENT_IO_URL: ${{ secrets.INCIDENT_IO_URL }}
          INCIDENT_IO_API_KEY: ${{ secrets.INCIDENT_IO_API_KEY }}
          WEEKS: ${{ secrets.WEEKS }}
        run: |
          python ingestion/jira_fetcher.py
          python ingestion/github_fetcher.py
          python ingestion/incident_fetcher.py

      - name: Execute Metric Wrangling Engines
        run: |
          python wrangling/df_cfr_engine.py
          python wrangling/mttd_mttr_engine.py

      - name: Generate Static HTML Dashboards
        env:
          ENABLE_SLACK_NOTIFICATIONS: ${{ secrets.ENABLE_SLACK_NOTIFICATIONS }}
          SLACK_WEBHOOK_URL_ENGINEERING: ${{ secrets.SLACK_WEBHOOK_URL_ENGINEERING }}
        run: |
          python publisher/site_generator.py

      - name: Commit and Push Updated Dashboards to Docs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/ database/dora_metrics.db
          git diff-index --quiet HEAD || git commit -m "Auto-update DORA metrics dashboards"
          git push